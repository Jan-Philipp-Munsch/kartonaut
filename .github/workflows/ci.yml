# Prüfungen bei jedem Push und Pull Request:
#   firmware    alle PlatformIO-Umgebungen aus firmware/platformio.ini bauen
#   native      Firmware-Tests ohne Hardware (pio test -e native, firmware/test/test_native/)
#   simulation  Tests des Python-Pakets tvcsim
#   pins        Pinbelegung der Firmware (BoardRevB.h) gegen die Schaltung (circuit.py)
#   tischtest   Parser-Tests von tools/bench_test.py, Host-Tests der Kalibrierbibliothek und des IMU-Kerns (g++)
#   ground      Laptop-Werkzeug tools/ground (Protokoll, MAC, gleiche Testvektoren wie die Firmware)
#   bridge      Funkbrücke tools/ground/bridge_pico (Raspberry Pi Pico, arduino-pico) bauen
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  envs:
    name: PlatformIO-Umgebungen finden
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        # jede [env:<name>]-Sektion wird gebaut, neue Test-Sketches also ohne Änderung hier
        # native ist die Testumgebung (Job "native"), sie hat kein Programm zum Bauen
        run: echo "list=$(sed -n 's/^\[env:\([^]]*\)\].*/\1/p' firmware/platformio.ini | grep -v '^native$' | jq -Rcs 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  firmware:
    name: Firmware (${{ matrix.env }})
    needs: envs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.envs.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-
      - run: pip install platformio
      - name: pio run -e ${{ matrix.env }}
        run: pio run -d firmware -e ${{ matrix.env }}

  native:
    name: Firmware-Tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: pio test -e native
        run: pio test -d firmware -e native
      - name: dasselbe ohne PlatformIO (g++)
        run: python firmware/tools/run_native_tests.py

  simulation:
    name: Simulation (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulation/pyproject.toml
      - run: pip install -e "simulation[test]"
      - run: python -m pytest -q
        working-directory: simulation
        env:
          MPLBACKEND: Agg

  pins:
    name: Pin-Abgleich rev B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: BoardRevB.h gegen circuit.py
        run: |
          set +e
          python firmware/tools/check_board_pins.py
          code=$?
          if [ $code -eq 2 ]; then
            echo "::warning file=hardware/mainboard/kicad/circuit.py::circuit.py hat noch keinen CS-Decoder (Stand vor E10), Pin-Abgleich übersprungen"
            exit 0
          fi
          exit $code

  tischtest:
    name: Tischtest-Werkzeuge (pytest, g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Parser von bench_test.py
        run: python -m pytest -q firmware/tools/test_bench_test.py
      - name: Kalibrierbibliothek (CRC, Ellipsoid-Fit, Achsen) und NMEA auf dem PC
        run: |
          g++ -std=c++17 -Wall -Wextra -O1 -I firmware/lib/calstore firmware/test/host/test_calstore.cpp -o /tmp/test_calstore
          /tmp/test_calstore
          g++ -std=c++17 -Wall -Wextra -I firmware/examples/revb_test firmware/test/host/test_nmea.cpp -o /tmp/test_nmea
          /tmp/test_nmea
          g++ -std=c++17 -Wall -Wextra -I firmware/lib/mainboard_revb firmware/test/host/test_lsm6dsv16x.cpp -o /tmp/test_lsm6dsv16x
          /tmp/test_lsm6dsv16x

  ground:
    name: Laptop-Werkzeug (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Protokoll und MAC gegen firmware/test/data/radio_vectors.csv
        run: python -m pytest -q tools/ground

  bridge:
    name: Funkbrücke (Pico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-bridge-${{ hashFiles('tools/ground/bridge_pico/platformio.ini') }}
          restore-keys: pio-bridge-
      - run: pip install platformio
      - name: pio run (tools/ground/bridge_pico)
        run: pio run -d tools/ground/bridge_pico
