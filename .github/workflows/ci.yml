# Prüfungen bei jedem Push und Pull Request:
#   firmware    alle PlatformIO-Umgebungen aus firmware/platformio.ini bauen (außer native)
#   flightcore  Tests des Flugkerns ohne Hardware (pio test -e native)
#   simulation  Tests des Python-Pakets tvcsim
#   pins        Pinbelegung der Firmware (BoardRevB.h) gegen die Schaltung (circuit.py)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  envs:
    name: PlatformIO-Umgebungen finden
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        # jede [env:<name>]-Sektion wird gebaut, neue Test-Sketches also ohne Änderung hier;
        # native ist die Testumgebung und läuft im Job flightcore
        run: echo "list=$(sed -n 's/^\[env:\([^]]*\)\].*/\1/p' firmware/platformio.ini | jq -Rcs 'split("\n") | map(select(length > 0 and . != "native"))')" >> "$GITHUB_OUTPUT"

  firmware:
    name: Firmware (${{ matrix.env }})
    needs: envs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.envs.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-
      - run: pip install platformio
      - name: pio run -e ${{ matrix.env }}
        run: pio run -d firmware -e ${{ matrix.env }}

  flightcore:
    name: Flugkern (pio test -e native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-native-
      - run: pip install platformio
      - run: pio test -d firmware -e native
      - name: dasselbe ohne PlatformIO (g++ mit Unity-Shim)
        run: firmware/tools/run_native_tests.sh

  simulation:
    name: Simulation (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulation/pyproject.toml
      - run: pip install -e "simulation[test]"
      - run: python -m pytest -q
        working-directory: simulation
        env:
          MPLBACKEND: Agg

  pins:
    name: Pin-Abgleich rev B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: BoardRevB.h gegen circuit.py
        run: |
          set +e
          python firmware/tools/check_board_pins.py
          code=$?
          if [ $code -eq 2 ]; then
            echo "::warning file=hardware/mainboard/kicad/circuit.py::circuit.py hat noch keinen CS-Decoder (Stand vor E10), Pin-Abgleich übersprungen"
            exit 0
          fi
          exit $code
