; PlatformIO-Konfiguration der Flug-Firmware (Teensy 4.1)
;
;   pio run                        baut die Flug-Firmware für die Breakouts (src/)
;   pio run -e teensy41_revb       dieselbe Firmware für das Mainboard rev B (-DBOARD_REVB)
;   pio run -e teensy41 -t upload  flasht über teensy-cli
;   pio run -e radio_beacon        baut einen Test-Sketch aus examples/
;   pio test -e native             Tests des Flugkerns ohne Hardware (lib/flightcore)
;   pio device monitor             serielle Konsole, 115200 Bd (Teleplot-kompatibel)

[platformio]
default_envs = teensy41

[env]
monitor_speed = 115200
build_flags = -Isrc -Ilib/flightcore

; Alle Teensy-Umgebungen erben von hier (extends); native nicht
[teensy]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli

; Bibliotheken der Flug-Firmware, beiden Rückenden gemeinsam
[flight]
lib_deps =
	adafruit/SdFat - Adafruit Fork@^2.2.54
	FastLED
	paulstoffregen/PWMServo@^2.1

; ----- Flug-Firmware, Breakouts (ICM-20948 DMP, BMP280, INA219, HC-12) -----
[env:teensy41]
extends = teensy
build_src_filter = +<*> -<SensorsRevB.cpp>
lib_deps =
	${flight.lib_deps}
	adafruit/Adafruit BMP280 Library@^2.6.8
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.0
	wollewald/INA219_WE@^1.3.8

; ----- Flug-Firmware, Mainboard rev B (ICM-42688-P, BMP390, INA239 an SPI1, E22) -----
[env:teensy41_revb]
extends = teensy
build_flags = ${env.build_flags} -DBOARD_REVB -Ilib/mainboard_revb
build_src_filter = +<*> -<SensorsBreakout.cpp>
lib_deps = ${flight.lib_deps}

; ----- Tests ohne Hardware (Unity): lib/flightcore gegen test/test_flightcore -----
[env:native]
platform = native
build_flags = -std=c++17 -Ilib/flightcore -DFLIGHTCORE_TEST_DATA_DIR=\"$PROJECT_DIR/test/data\"
build_src_filter = -<*>
test_build_src = no

; ----- Test-Sketches (je ein main.cpp unter examples/<name>/) -----
[env:radio_beacon]
extends = teensy
build_src_filter = -<*> +<../examples/radio_beacon/>

[env:pyro_mosfet_test]
extends = teensy
build_src_filter = -<*> +<Indicators.cpp> +<../examples/pyro_mosfet_test/>
lib_deps = FastLED

[env:i2c_scanner]
extends = teensy
build_src_filter = -<*> +<../examples/i2c_scanner/>

; Kalibrierung: IMU (Gyro-Bias, Rauschen, Sechs-Lagen-Accel, Barometer), auf beiden Rückenden
[env:calib_imu]
extends = teensy
build_src_filter = -<*> +<SensorsBreakout.cpp> +<../examples/calib_imu/>
lib_deps =
	adafruit/Adafruit BMP280 Library@^2.6.8
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.0
	wollewald/INA219_WE@^1.3.8

[env:calib_imu_revb]
extends = teensy
build_flags = ${env.build_flags} -DBOARD_REVB -Ilib/mainboard_revb
build_src_filter = -<*> +<SensorsRevB.cpp> +<../examples/calib_imu/>

; Kalibrierung: Servos (Mitte, Fenster, Servo-Grad je TVC-Grad, Sprungantwort), IMU auf dem Kardan
[env:calib_servo]
extends = teensy
build_src_filter = -<*> +<SensorsBreakout.cpp> +<Control.cpp> +<../examples/calib_servo/>
lib_deps =
	adafruit/Adafruit BMP280 Library@^2.6.8
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.0
	wollewald/INA219_WE@^1.3.8
	paulstoffregen/PWMServo@^2.1

[env:calib_servo_revb]
extends = teensy
build_flags = ${env.build_flags} -DBOARD_REVB -Ilib/mainboard_revb
build_src_filter = -<*> +<SensorsRevB.cpp> +<Control.cpp> +<../examples/calib_servo/>
lib_deps = paulstoffregen/PWMServo@^2.1

; ----- Mainboard rev B: Inbetriebnahme (Treiber in lib/mainboard_revb/, Pins in BoardRevB.h) -----
[env:revb_bringup]
extends = teensy
build_flags = ${env.build_flags} -Ilib/mainboard_revb
build_src_filter = -<*> +<../examples/revb_bringup/>
lib_deps = FastLED
