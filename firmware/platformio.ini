; PlatformIO-Konfiguration der Flug-Firmware (Teensy 4.1)
;
;   pio run                    baut die Flug-Firmware (src/)
;   pio run -t upload          flasht sie über teensy-cli
;   pio run -e radio_beacon    baut einen Test-Sketch aus examples/
;   pio device monitor         serielle Konsole, 115200 Bd (Teleplot-kompatibel)

[platformio]
default_envs = teensy41

[env]
monitor_speed = 115200
build_flags = -Isrc
; eigenes Testgerüst (test/test_custom_runner.py, minitest.h) statt Unity aus der Registry
test_framework = custom

; gemeinsame Basis aller Teensy-Umgebungen (die native Testumgebung erbt sie nicht)
[teensy]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli

; ----- Flug-Firmware, Breakout-Aufbau (ICM-20948, BMP280, INA219 an I2C) -----
[env:teensy41]
extends = teensy
build_src_filter = +<*> -<Sensors_revb.cpp>
lib_deps =
	adafruit/Adafruit BMP280 Library@^2.6.8
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.0
	wollewald/INA219_WE@^1.3.8
	tomstewart89/BasicLinearAlgebra@^5.1
	adafruit/SdFat - Adafruit Fork@^2.2.54
	FastLED
	Servo

; ----- Flug-Firmware, Mainboard rev B (ICM-42688-P, BMP390, INA239 an SPI1, Mux) -----
[env:teensy41_revb]
extends = teensy
build_src_filter = +<*> -<Sensors_breakout.cpp>
build_flags = -Isrc -DBOARD_REVB
lib_deps =
	tomstewart89/BasicLinearAlgebra@^5.1
	adafruit/SdFat - Adafruit Fork@^2.2.54
	FastLED
	Servo

; ----- Test-Sketches (je ein main.cpp unter examples/<name>/) -----
[env:radio_beacon]
extends = teensy
build_src_filter = -<*> +<../examples/radio_beacon/>

[env:pyro_mosfet_test]
extends = teensy
build_src_filter = -<*> +<Indicators.cpp> +<../examples/pyro_mosfet_test/>
lib_deps = FastLED

[env:i2c_scanner]
extends = teensy
build_src_filter = -<*> +<../examples/i2c_scanner/>

; Experiment E01: Servo -> Kardan Übertragungsfunktion (docs/experiments/E01_servo_ident.md)
[env:servo_ident]
extends = teensy
build_src_filter = -<*> +<../examples/servo_ident/>
lib_deps =
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.0

; ----- Native Tests ohne Hardware (pio test -e native, siehe test/test_native/) -----
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<Attitude.cpp> +<FlightState.cpp> +<Pyro.cpp> +<Telemetry.cpp> +<ControlLaw.cpp> +<StateMemory.cpp>
build_flags = -Isrc -Itest/test_native -DNATIVE_TEST -std=c++17
lib_deps =

; ----- Mainboard rev B (Treiber in lib/mainboard_revb/, Pins in BoardRevB.h) -----
[env:revb_bringup]
extends = teensy
build_src_filter = -<*> +<../examples/revb_bringup/>
lib_deps = FastLED
