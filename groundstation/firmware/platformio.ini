; Bodenstation Mission Space – ESP32-S3 (Arduino)
; Bauen:      pio run
; Flashen:    pio run -t upload        (USB-C "UART" bzw. "USB" am DevKitC-1)
; Monitor:    pio device monitor
;
; Die Weboberfläche (src/index.html) wird beim Bauen als Text in die Firmware
; eingebettet (board_build.embed_txtfiles); ein eigenes Dateisystem gibt es nicht.

[env:groundstation]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=0

board_build.embed_txtfiles = src/index.html

lib_deps =
  esp32async/AsyncTCP @ ^3.3.2
  esp32async/ESPAsyncWebServer @ ^3.6.0
  bblanchon/ArduinoJson @ ^7.2.0
