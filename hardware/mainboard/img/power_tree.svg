<text x="777.0" y="212.5" font-size="9" text-anchor="middle" fill="#222">100 µF: LoRa E22, GPS</text>
<text x="30" y="175" font-size="9" text-anchor="start" fill="#444">Teensy 3V3 (≤ 250 mA) → ICM-42688-P, BMP390, INA219, I²C-Pull-ups</text>
<text x="30" y="190" font-size="9" text-anchor="start" fill="#444">Teiler 100 k / 33 k von VSYS_IN → Pin 41 (VBAT1_SENSE)</text>
<text x="30" y="215" font-size="9" font-style="italic" text-anchor="start" fill="#444">Dauer 0,4 A an 5 V (0,6 A aus dem Akku), Spitze 0,8 A beim LoRa-Sendepuls</text>
<rect x="20" y="285" width="1120" height="290" rx="8" fill="#f6c4c4" stroke="none" stroke-width="1" fill-opacity="0.35"/>
<text x="30" y="302" font-size="12" font-weight="bold" text-anchor="start" fill="#222">2S-Pfad: Servos, Rollmotor, Pyro</text>
