<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker><marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="26" font-size="15" font-weight="bold" text-anchor="start" fill="#222">Stromversorgung rev B1: zwei Akkus, Lastschalter, fünf Schienen</text>
<text x="20" y="44" font-size="10" text-anchor="start" fill="#555">Der 1S-Pfad sieht keine Servo- und Pyro-Spitzen. Beide Massen treffen sich an einem Sternpunkt (NT1) am 2S-Minus. Laden in der Rakete vor den Lastschaltern.</text>
<rect x="20" y="65" width="1120" height="190" rx="8" fill="#f4d6a0" stroke="none" stroke-width="1" fill-opacity="0.35"/>
<text x="30" y="82" font-size="12" font-weight="bold" text-anchor="start" fill="#222">1S-Pfad: Elektronik</text>
<rect x="30" y="90" width="92" height="60" rx="4" fill="#f4d6a0" stroke="#333" stroke-width="1.2"/>
<text x="76.0" y="111.0" font-size="12" font-weight="bold" text-anchor="middle">1S LiPo</text>
<text x="76.0" y="126.0" font-size="10" text-anchor="middle" fill="#222">3,0–4,2 V</text>
<text x="76.0" y="139.0" font-size="10" text-anchor="middle" fill="#222">JST-PH</text>
<path d="M122,120 L136,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="136" y="90" width="92" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="182.0" y="117.5" font-size="12" font-weight="bold" text-anchor="middle">Q2 AO3401A</text>
<text x="182.0" y="132.5" font-size="10" text-anchor="middle" fill="#222">Verpolschutz</text>
<path d="M228,120 L242,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="242" y="90" width="92" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="288.0" y="111.0" font-size="12" font-weight="bold" text-anchor="middle">F2 Polyfuse</text>
<text x="288.0" y="126.0" font-size="10" text-anchor="middle" fill="#222">2 A</text>
<text x="288.0" y="139.0" font-size="10" text-anchor="middle" fill="#222">+ Lader MCP73831</text>
<path d="M334,120 L348,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="348" y="90" width="92" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="394.0" y="111.0" font-size="12" font-weight="bold" text-anchor="middle">Q7 AO3401A</text>
<text x="394.0" y="126.0" font-size="10" text-anchor="middle" fill="#222">Lastschalter</text>
<text x="394.0" y="139.0" font-size="10" text-anchor="middle" fill="#222">Gate: J_SW / JP1</text>
<path d="M440,120 L454,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="454" y="90" width="110" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="509.0" y="104.5" font-size="12" font-weight="bold" text-anchor="middle">TPS63070</text>
<text x="509.0" y="119.5" font-size="10" text-anchor="middle" fill="#222">Buck-Boost</text>
<text x="509.0" y="132.5" font-size="10" text-anchor="middle" fill="#222">2–16 V → 5 V / 2 A</text>
<text x="509.0" y="145.5" font-size="10" text-anchor="middle" fill="#222">1,5 µH, EN ab 3,1 V</text>
<path d="M564,120 L578,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="578" y="90" width="92" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="624.0" y="111.0" font-size="12" font-weight="bold" text-anchor="middle">5V_SYS</text>
<text x="624.0" y="126.0" font-size="10" text-anchor="middle" fill="#222">3× 22 µF</text>
<text x="624.0" y="139.0" font-size="10" text-anchor="middle" fill="#222">Testpunkt TP3</text>
<path d="M670,120 L690,120 L690,100 L710,100" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="710" y="85" width="300" height="32" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="860.0" y="98.5" font-size="11" font-weight="bold" text-anchor="middle">Teensy VIN</text>
<text x="860.0" y="112.5" font-size="9" text-anchor="middle" fill="#222">über D1 SS14, 2× 470 µF Hold-up; USB darf stecken</text>
<path d="M670,120 L690,120 L690,150 L710,150" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="710" y="135" width="300" height="32" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="860.0" y="148.5" font-size="11" font-weight="bold" text-anchor="middle">WS2812B-Kette, Summer, J_CAM, J_LED</text>
<text x="860.0" y="162.5" font-size="9" text-anchor="middle" fill="#222">SN74LV1T34, AO3400A</text>
<path d="M670,120 L690,120 L690,200 L710,200" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="710" y="185" width="300" height="32" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="860.0" y="198.5" font-size="11" font-weight="bold" text-anchor="middle">AP2112K-3.3 → 3V3_RF / 3V3_EXP</text>
<text x="860.0" y="212.5" font-size="9" text-anchor="middle" fill="#222">100 µF: LoRa E22, GPS / J_STACK</text>
<text x="30" y="175" font-size="9" text-anchor="start" fill="#444">Teensy 3V3 (≤ 250 mA) → INA239, 74HC138, 74HC4051, LIS3MDL, SHT40, I²C-Pull-ups; Ferrit + 10 µF → 3V3_SENS: LSM6DSV16X, BMP390</text>
<text x="30" y="190" font-size="9" text-anchor="start" fill="#444">Teiler 100 k / 33 k von VBAT1_F → Mux-Kanal 4 (VBAT1_SENSE), auch bei ausgeschalteter Rakete</text>
<text x="30" y="215" font-size="9" font-style="italic" text-anchor="start" fill="#444">Dauer 0,4 A an 5 V (0,6 A aus dem Akku), Spitze 0,8 A beim LoRa-Sendepuls</text>
<rect x="20" y="285" width="1120" height="290" rx="8" fill="#f6c4c4" stroke="none" stroke-width="1" fill-opacity="0.35"/>
<text x="30" y="302" font-size="12" font-weight="bold" text-anchor="start" fill="#222">2S-Pfad: Servos, Rollmotor, Pyro</text>
<rect x="30" y="310" width="92" height="60" rx="4" fill="#f6c4c4" stroke="#333" stroke-width="1.2"/>
<text x="76.0" y="331.0" font-size="12" font-weight="bold" text-anchor="middle">2S LiPo</text>
<text x="76.0" y="346.0" font-size="10" text-anchor="middle" fill="#222">6,0–8,4 V</text>
<text x="76.0" y="359.0" font-size="10" text-anchor="middle" fill="#222">XT30; J_CHG2</text>
