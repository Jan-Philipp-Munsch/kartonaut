<text x="777.0" y="112.5" font-size="9" text-anchor="middle" fill="#222">über D1 SS14; USB darf stecken</text>
<path d="M622,120 L642,120 L642,150 L662,150" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
