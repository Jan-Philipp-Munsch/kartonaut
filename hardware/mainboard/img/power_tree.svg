<text x="839.0" y="451.5" font-size="9" text-anchor="middle" fill="#222">Buck 5 V / 3 A, 2,2 µH</text>
<path d="M894,440 L914,440" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="914" y="420" width="200" height="40" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="1014.0" y="437.5" font-size="11" font-weight="bold" text-anchor="middle">5V_SERVO</text>
<text x="1014.0" y="451.5" font-size="9" text-anchor="middle" fill="#222">470 µF: J_SERVO3 (Reserve), DRV8833</text>
