<text x="434.0" y="352.5" font-size="10" text-anchor="middle" fill="#222">Teiler → Pin 40</text>
<path d="M484,340 L504,340 L504,305 L524,305" fill="none" stroke="#b03a2e" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="524" y="290" width="100" height="32" rx="4" fill="white" stroke="#b03a2e" stroke-width="1.2"/>
<text x="574.0" y="303.5" font-size="11" font-weight="bold" text-anchor="middle">J_ARM</text>
<text x="574.0" y="317.5" font-size="9" text-anchor="middle" fill="#222">Arming-Schalter</text>
