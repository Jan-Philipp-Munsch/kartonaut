<text x="330" y="489" font-size="9" text-anchor="start" fill="#222">0,3 A</text>
<text x="380" y="489" font-size="9" text-anchor="start" fill="#222">1,7 A</text>
<text x="30" y="504" font-size="9" text-anchor="start" fill="#222">Pyro</text>
<text x="100" y="504" font-size="9" text-anchor="start" fill="#222">E-Match 3–5 A für 20 ms</text>
<text x="330" y="504" font-size="9" text-anchor="start" fill="#222">–</text>
<text x="380" y="504" font-size="9" text-anchor="start" fill="#222">5 A</text>
<text x="30" y="545" font-size="9" text-anchor="start" fill="#444">Firmware: beide Akkuspannungen per ADC, 2S-Strom per INA219 (bis 16 A, 2 mA Auflösung).</text>
<text x="30" y="560" font-size="9" text-anchor="start" fill="#444">Warnton bei 1S &lt; 3,5 V oder 2S &lt; 6,6 V; keine Startfreigabe ohne beide Akkus.</text>
