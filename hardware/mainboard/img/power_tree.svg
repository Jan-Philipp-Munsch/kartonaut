<text x="777.0" y="148.5" font-size="11" font-weight="bold" text-anchor="middle">2× WS2812B, Summer</text>
<text x="777.0" y="162.5" font-size="9" text-anchor="middle" fill="#222">74AHCT1G125, AO3400A</text>
<path d="M622,120 L642,120 L642,200 L662,200" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="662" y="185" width="230" height="32" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
