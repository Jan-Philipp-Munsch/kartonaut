<rect x="136" y="310" width="92" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="182.0" y="337.5" font-size="12" font-weight="bold" text-anchor="middle">Q1 AO3401A</text>
<text x="182.0" y="352.5" font-size="10" text-anchor="middle" fill="#222">Verpolschutz</text>
<path d="M228,340 L242,340" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="242" y="310" width="92" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="288.0" y="337.5" font-size="12" font-weight="bold" text-anchor="middle">F1 Polyfuse</text>
<text x="288.0" y="352.5" font-size="10" text-anchor="middle" fill="#222">3 A hold / 6 A</text>
<path d="M334,340 L348,340" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="348" y="310" width="92" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="394.0" y="331.0" font-size="12" font-weight="bold" text-anchor="middle">Q6 AO3401A</text>
<text x="394.0" y="346.0" font-size="10" text-anchor="middle" fill="#222">Lastschalter</text>
<text x="394.0" y="359.0" font-size="10" text-anchor="middle" fill="#222">Gate: J_SW / JP2</text>
<path d="M440,340 L454,340" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="454" y="310" width="92" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="500.0" y="331.0" font-size="12" font-weight="bold" text-anchor="middle">VBAT_PROT</text>
<text x="500.0" y="346.0" font-size="10" text-anchor="middle" fill="#222">Teiler → Mux 5</text>
<text x="500.0" y="359.0" font-size="10" text-anchor="middle" fill="#222">Testpunkt TP1</text>
<path d="M546,340 L566,340 L566,305 L586,305" fill="none" stroke="#b03a2e" stroke-width="1.4" marker-end="url(#arr)"/>
