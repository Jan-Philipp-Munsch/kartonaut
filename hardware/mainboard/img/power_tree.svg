<text x="100" y="458" font-size="9" font-weight="bold" text-anchor="start" fill="#222">Verbraucher</text>
<text x="330" y="458" font-size="9" font-weight="bold" text-anchor="start" fill="#222">Dauer</text>
<text x="380" y="458" font-size="9" font-weight="bold" text-anchor="start" fill="#222">Spitze</text>
<text x="30" y="474" font-size="9" text-anchor="start" fill="#222">VSERVO</text>
<text x="100" y="474" font-size="9" text-anchor="start" fill="#222">2× W5652H, Blockierstrom je ~1 A</text>
<text x="330" y="474" font-size="9" text-anchor="start" fill="#222">0,2 A</text>
<text x="380" y="474" font-size="9" text-anchor="start" fill="#222">2 A</text>
<text x="30" y="489" font-size="9" text-anchor="start" fill="#222">5V_SERVO</text>
