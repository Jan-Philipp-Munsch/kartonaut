<text x="636.0" y="317.5" font-size="9" text-anchor="middle" fill="#222">Schlüsselschalter</text>
<path d="M686,306 L706,306" fill="none" stroke="#b03a2e" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="706" y="290" width="170" height="32" rx="4" fill="white" stroke="#b03a2e" stroke-width="1.2"/>
<text x="791.0" y="303.5" font-size="11" font-weight="bold" text-anchor="middle">VBAT_ARMED</text>
<text x="791.0" y="317.5" font-size="9" text-anchor="middle" fill="#222">Pyro 1–4 (+), SMAJ12CA; 3/4 DNP</text>
<text x="886" y="308" font-size="9" text-anchor="start" fill="#b03a2e">Teiler → Mux-Kanal 6 (ARM_SENSE); Zündstrom läuft nicht durch den Shunt</text>
<path d="M566,340 L566,390 L586,390" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="586" y="370" width="120" height="40" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="646.0" y="387.5" font-size="11" font-weight="bold" text-anchor="middle">R_SH1 20 mΩ</text>
<text x="646.0" y="401.5" font-size="9" text-anchor="middle" fill="#222">2512, Kelvin, INA239 (SPI1)</text>
<path d="M706,390 L726,390" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="726" y="370" width="330" height="40" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="891.0" y="387.5" font-size="11" font-weight="bold" text-anchor="middle">VSERVO = Akku direkt, 2× 330 µF Polymer</text>
<text x="891.0" y="401.5" font-size="9" text-anchor="middle" fill="#222">J_SERVO1–4 (TVC, Fallschirm, Beine), DRV8833 (PWM begrenzt), J_STACK</text>
<text x="30" y="440" font-size="10" font-weight="bold" text-anchor="start" fill="#222">Strombudget 2S</text>
<text x="30" y="458" font-size="9" font-weight="bold" text-anchor="start" fill="#222">Schiene</text>
<text x="100" y="458" font-size="9" font-weight="bold" text-anchor="start" fill="#222">Verbraucher</text>
<text x="380" y="458" font-size="9" font-weight="bold" text-anchor="start" fill="#222">Dauer</text>
<text x="430" y="458" font-size="9" font-weight="bold" text-anchor="start" fill="#222">Spitze</text>
<text x="30" y="474" font-size="9" text-anchor="start" fill="#222">VSERVO</text>
<text x="100" y="474" font-size="9" text-anchor="start" fill="#222">2× W5652H (TVC), Blockierstrom je ~1 A</text>
<text x="380" y="474" font-size="9" text-anchor="start" fill="#222">0,2 A</text>
<text x="430" y="474" font-size="9" text-anchor="start" fill="#222">2 A</text>
<text x="30" y="489" font-size="9" text-anchor="start" fill="#222">VSERVO</text>
<text x="100" y="489" font-size="9" text-anchor="start" fill="#222">Fallschirm-/Beine-Servo, Rollmotor ~1 A (PWM begrenzt)</text>
<text x="380" y="489" font-size="9" text-anchor="start" fill="#222">0,3 A</text>
<text x="430" y="489" font-size="9" text-anchor="start" fill="#222">2 A</text>
<text x="30" y="504" font-size="9" text-anchor="start" fill="#222">Pyro</text>
<text x="100" y="504" font-size="9" text-anchor="start" fill="#222">E-Match 3–5 A für 20 ms, Puls 50–100 ms</text>
<text x="380" y="504" font-size="9" text-anchor="start" fill="#222">–</text>
<text x="430" y="504" font-size="9" text-anchor="start" fill="#222">5 A</text>
<text x="30" y="545" font-size="9" text-anchor="start" fill="#444">Firmware: beide Akkuspannungen und ARM über den Analogmux, 2S-Strom per INA239 (±8 A, 0,25 mA Auflösung).</text>
<text x="30" y="560" font-size="9" text-anchor="start" fill="#444">Warnton bei 1S &lt; 3,5 V oder 2S &lt; 6,6 V; keine Startfreigabe ohne beide Akkus.</text>
