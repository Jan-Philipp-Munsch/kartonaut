<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker><marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="26" font-size="15" font-weight="bold" text-anchor="start" fill="#222">Stromversorgung: zwei Akkus, vier Schienen</text>
<text x="20" y="44" font-size="10" text-anchor="start" fill="#555">Der 1S-Pfad sieht keine Servo- und Pyro-Spitzen. Beide Massen treffen sich an einem Sternpunkt am 2S-Minus neben dem Shunt.</text>
<rect x="20" y="65" width="1120" height="190" rx="8" fill="#f4d6a0" stroke="none" stroke-width="1" fill-opacity="0.35"/>
<text x="30" y="82" font-size="12" font-weight="bold" text-anchor="start" fill="#222">1S-Pfad: Elektronik</text>
<rect x="30" y="90" width="100" height="60" rx="4" fill="#f4d6a0" stroke="#333" stroke-width="1.2"/>
<text x="80.0" y="111.0" font-size="12" font-weight="bold" text-anchor="middle">1S LiPo</text>
<text x="80.0" y="126.0" font-size="10" text-anchor="middle" fill="#222">3,0–4,2 V</text>
<text x="80.0" y="139.0" font-size="10" text-anchor="middle" fill="#222">JST-PH</text>
<path d="M130,120 L148,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="148" y="90" width="100" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="198.0" y="117.5" font-size="12" font-weight="bold" text-anchor="middle">Q2 AO3401A</text>
<text x="198.0" y="132.5" font-size="10" text-anchor="middle" fill="#222">Verpolschutz</text>
<path d="M248,120 L266,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="266" y="90" width="100" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="316.0" y="111.0" font-size="12" font-weight="bold" text-anchor="middle">SW1a</text>
<text x="316.0" y="126.0" font-size="10" text-anchor="middle" fill="#222">Hauptschalter</text>
<text x="316.0" y="139.0" font-size="10" text-anchor="middle" fill="#222">oder JP1</text>
<path d="M366,120 L384,120" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="384" y="90" width="120" height="60" rx="4" fill="white" stroke="#333" stroke-width="1.2"/>
<text x="444.0" y="104.5" font-size="12" font-weight="bold" text-anchor="middle">TPS63070</text>
<text x="444.0" y="119.5" font-size="10" text-anchor="middle" fill="#222">Buck-Boost</text>
<text x="444.0" y="132.5" font-size="10" text-anchor="middle" fill="#222">2–16 V → 5 V / 2 A</text>
<text x="444.0" y="145.5" font-size="10" text-anchor="middle" fill="#222">1,5 µH</text>
