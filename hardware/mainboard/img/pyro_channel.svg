<text x="50" y="377" font-size="9.5" text-anchor="start" fill="#222">Firmware: Zünden nur in den Zuständen Apogäum oder Landung, Puls 50–100 ms mit Abbruch bei Durchgangsverlust, jeder Kanal höchstens einmal,</text>
<text x="50" y="391" font-size="9.5" text-anchor="start" fill="#222">ohne ARM_SENSE keine Freigabe. Durchgang (PYRO_SENSE auf VBAT) wird vor dem Start per Summer gemeldet.</text>
<text x="50" y="404" font-size="9.5" font-weight="bold" text-anchor="start" fill="#222">Tischtest nur mit Glühlämpchen oder 2-Ω-Widerstand, nie mit Ladung.</text>
