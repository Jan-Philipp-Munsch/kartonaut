26.10; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
lib_deps = 
	Servo
	adafruit/Adafruit BMP280 Library@^2.6.8
	FastLED
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.0
	tomstewart89/BasicLinearAlgebra@^5.1
	adafruit/SdFat - Adafruit Fork@^2.2.54
	mikalhart/TinyGPSPlus@^1.1.0
	pkourany/MPU6050@^1.0.3
	adafruit/Adafruit INA219@^1.2.3
	wollewald/INA219_WE@^1.3.8
	https://github.com/PaulStoffregen/LittleFS.git
	paulstoffregen/PWMServo@^2.1
