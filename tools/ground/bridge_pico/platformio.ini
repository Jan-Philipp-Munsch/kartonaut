; Funkbrücke der Bodenstation: Raspberry Pi Pico mit E22-400T22S (docs/Plan_Bordzuendung_2026-10-27.md §5)
;
;   pio run -d tools/ground/bridge_pico                 bauen
;   pio run -d tools/ground/bridge_pico -t upload       flashen (BOOTSEL gedrückt einstecken oder per USB)
;
; Protokoll und E22-Register kommen aus der Flug-Firmware (firmware/src: Telemetry.h, Config.h, E22Config.h),
; nichts wird kopiert.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_flags = -I../../../firmware/src
monitor_speed = 115200
